<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Job Collector</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #0a66c2;
      --primary-hover: #004182;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 280px;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: var(--primary);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      color: #ffffff;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .btn-action {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-action:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-muted);
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      word-break: break-word;
    }

    .status-card.success {
      color: var(--success);
      border-color: rgba(34, 197, 94, 0.3);
      background-color: rgba(34, 197, 94, 0.08);
    }

    .status-card.error {
      color: var(--error);
      border-color: rgba(239, 68, 68, 0.3);
      background-color: rgba(239, 68, 68, 0.08);
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-icon">in</div>
      <h1>LinkedIn Job Collector</h1>
    </div>

    <button id="collectBtn" class="btn-action">
      <span id="spinner" class="spinner"></span>
      <span id="btnText">Copy 100 Jobs</span>
    </button>

    <div id="status" class="status-card">
      Ready
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
